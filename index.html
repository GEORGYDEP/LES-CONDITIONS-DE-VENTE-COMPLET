<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conditions de vente — Partie 1</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ KIT VISUEL — jetons ============ */
:root {
  --bg:#0c0f1a; --bg2:#141a2b; --bg3:#1b2238; --card:#181f33;
  --accent:#22d68a; --accent2:#19b874; --orange:#ff8a3d; --gold:#ffd166;
  --blue:#4d9bff; --purple:#a78bfa; --pink:#ff5c8a;
  --text:#eef0f6; --text2:#9aa3b8; --text3:#6b7288; --border:#2a3148;
  --radius:16px; --success:#22d68a; --error:#ff4d6d; --warning:#ffb347;
}
/* ============ KIT VISUEL — socle ============ */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
body::before {
  content:''; position:fixed; inset:-20%; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 40% 35% at 15% 10%, rgba(34,214,138,.10), transparent 70%),
    radial-gradient(ellipse 35% 40% at 85% 90%, rgba(167,139,250,.10), transparent 70%),
    radial-gradient(ellipse 30% 30% at 70% 20%, rgba(255,209,102,.05), transparent 70%);
  animation:aurora 24s ease-in-out infinite alternate;
}
@keyframes aurora { from { transform:translate3d(0,0,0) rotate(0deg); } to { transform:translate3d(3%,2%,0) rotate(3deg); } }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
.main { max-width:760px; margin:0 auto; padding:16px 16px 90px; position:relative; z-index:1; }
.screen { animation:fadeIn .4s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

/* ============ KIT VISUEL — icônes ============ */
.ico { width:1em; height:1em; flex-shrink:0; vertical-align:-.125em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ico.lg { width:1.5em; height:1.5em; }
.ico.xl { width:2.2em; height:2.2em; stroke-width:1.6; }
.lvl-banner { width:100%; height:96px; display:block; border-radius:var(--radius) var(--radius) 0 0; margin-bottom:-1px; }

/* ============ KIT VISUEL — en-tête ============ */
.app-header { position:sticky; top:0; z-index:100; background:rgba(12,15,26,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark { width:34px; height:34px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, rgba(34,214,138,.25), rgba(255,209,102,.2)); border:1px solid rgba(255,209,102,.35); font-size:1.05rem; }
.brand-title { font-weight:800; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-tag { font-size:.66rem; font-weight:800; color:var(--bg); background:linear-gradient(90deg,var(--gold),#ffb347); padding:2px 8px; border-radius:20px; margin-left:6px; letter-spacing:.3px; vertical-align:middle; }
.hud { display:flex; align-items:center; gap:8px; flex-wrap:nowrap; }
.pill { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px; font-weight:700; font-family:'Space Mono',monospace; font-size:.78rem; border:1px solid var(--border); background:var(--bg2); white-space:nowrap; }
.pill.xp { color:var(--accent); border-color:rgba(34,214,138,.35); background:rgba(34,214,138,.1); position:relative; }
.pill.streak { color:var(--orange); border-color:rgba(255,138,61,.35); background:rgba(255,138,61,.1); }
.pill.streak.hot { animation:flamePulse 1s ease-in-out infinite; box-shadow:0 0 14px rgba(255,138,61,.45); }
@keyframes flamePulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.07); } }
.icon-btn { width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text2); cursor:pointer; font-size:.95rem; display:flex; align-items:center; justify-content:center; transition:.2s; }
.icon-btn:hover { border-color:var(--accent); color:var(--text); }

/* ============ KIT VISUEL — barre d'XP ============ */
.xp-wrap { background:rgba(12,15,26,.85); border-bottom:1px solid var(--border); padding:6px 16px 8px; position:relative; z-index:90; }
.xp-row { display:flex; justify-content:space-between; align-items:center; font-size:.76rem; color:var(--text2); max-width:760px; margin:0 auto 5px; }
.xp-rank { font-weight:800; color:var(--gold); }
.xp-track { height:7px; background:var(--bg3); border-radius:8px; overflow:hidden; max-width:760px; margin:0 auto; position:relative; border:1px solid var(--border); }
.xp-fill { height:100%; width:0%; border-radius:8px; transition:width .8s cubic-bezier(.22,1,.36,1); background:linear-gradient(90deg, var(--accent), var(--gold)); position:relative; }
.xp-fill::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform:translateX(-100%); animation:shine 2.8s ease-in-out infinite; }
@keyframes shine { 0% { transform:translateX(-100%); } 60%,100% { transform:translateX(100%); } }
.xp-ticks { position:absolute; inset:0; pointer-events:none; }
.xp-tick { position:absolute; top:0; bottom:0; width:2px; background:rgba(12,15,26,.8); }

/* ============ KIT VISUEL — pastilles de navigation ============ */
.nav-strip { display:flex; justify-content:center; gap:7px; padding:10px 16px 4px; flex-wrap:wrap; position:relative; z-index:1; }
.nav-dot { width:30px; height:30px; border-radius:50%; border:2px solid var(--border); background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; cursor:pointer; transition:.25s; font-family:'Space Mono',monospace; color:var(--text2); }
.nav-dot:hover:not(.locked) { border-color:var(--accent); transform:scale(1.12); }
.nav-dot.active { border-color:var(--gold); background:var(--gold); color:var(--bg); box-shadow:0 0 12px rgba(255,209,102,.5); }
.nav-dot.completed { border-color:var(--accent); background:rgba(34,214,138,.15); color:var(--accent); }
.nav-dot.locked { opacity:.35; cursor:not-allowed; }

/* ============ KIT VISUEL — boutons ============ */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 26px; border-radius:12px; border:none; font-weight:700; font-size:.98rem; cursor:pointer; transition:.22s; text-decoration:none; }
.btn-primary { background:var(--accent); color:var(--bg); box-shadow:0 6px 18px rgba(34,214,138,.25); }
.btn-primary:hover { background:var(--accent2); transform:translateY(-2px); box-shadow:0 10px 24px rgba(34,214,138,.35); }
.btn-gold { background:linear-gradient(90deg,var(--gold),#ffb347); color:var(--bg); box-shadow:0 6px 18px rgba(255,209,102,.25); }
.btn-gold:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(255,209,102,.4); }
.btn-outline { background:transparent; border:1.5px solid var(--accent); color:var(--accent); padding:10px 20px; font-size:.9rem; }
.btn-outline:hover { background:var(--accent); color:var(--bg); }
.btn-outline-orange { background:transparent; border:1.5px solid var(--orange); color:var(--orange); padding:10px 20px; font-size:.9rem; }
.btn-outline-orange:hover { background:var(--orange); color:var(--bg); }
.btn-ghost { background:var(--bg2); border:1px solid var(--border); color:var(--text2); padding:10px 18px; font-size:.9rem; }
.btn-ghost:hover { color:var(--text); border-color:var(--text3); }
.btn-verify { background:var(--blue); color:#fff; padding:11px 22px; font-size:.92rem; }
.btn-verify:hover { filter:brightness(1.1); }
.btn-disabled { opacity:.4; cursor:not-allowed; pointer-events:none; }
.btn-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }

/* ============ KIT VISUEL — accueil ============ */
.hero { background:linear-gradient(150deg, var(--bg2), var(--bg3)); border:1px solid var(--border); border-radius:24px; padding:44px 28px 34px; text-align:center; position:relative; overflow:hidden; }
.hero::before { content:''; position:absolute; top:-60%; left:50%; transform:translateX(-50%); width:520px; height:520px; background:radial-gradient(circle, rgba(255,209,102,.13), transparent 62%); pointer-events:none; }
.hero-emoji { font-size:3.4rem; margin-bottom:10px; filter:drop-shadow(0 6px 18px rgba(255,209,102,.35)); }
.hero-title { font-size:2.5rem; font-weight:900; line-height:1.1; margin-bottom:6px; background:linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:titleShine 5s linear infinite; }
@keyframes titleShine { to { background-position:200% center; } }
.hero-sub { color:var(--text2); font-size:1.05rem; margin-bottom:8px; }
.hero-desc { color:var(--text3); font-size:.9rem; line-height:1.65; max-width:520px; margin:0 auto 26px; }
.hero-stats { display:flex; justify-content:center; gap:26px; margin-bottom:26px; flex-wrap:wrap; }
.stat { text-align:center; }
.stat-val { font-size:1.5rem; font-weight:900; color:var(--gold); font-family:'Space Mono',monospace; }
.stat-lbl { font-size:.74rem; color:var(--text3); }

/* ============ KIT VISUEL — chemin de niveaux ============ */
.hub-head { text-align:center; margin:6px 0 18px; }
.hub-head h2 { font-size:1.5rem; font-weight:900; }
.hub-head p { color:var(--text2); font-size:.9rem; margin-top:4px; }
.path { position:relative; padding:6px 0; }
.path::before { content:''; position:absolute; top:0; bottom:0; left:50%; width:3px; transform:translateX(-50%); background:repeating-linear-gradient(to bottom, var(--border) 0 10px, transparent 10px 20px); }
.path-item { position:relative; display:flex; align-items:center; margin:0 0 14px; }
.path-item .node { position:absolute; left:50%; transform:translateX(-50%); width:42px; height:42px; border-radius:50%; border:3px solid var(--border); background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:.85rem; z-index:2; color:var(--text2); }
.path-item.done .node { border-color:var(--accent); color:var(--accent); background:rgba(34,214,138,.12); box-shadow:0 0 16px rgba(34,214,138,.35); }
.path-item.next .node { border-color:var(--gold); color:var(--gold); background:rgba(255,209,102,.12); box-shadow:0 0 18px rgba(255,209,102,.5); animation:nodePulse 1.6s ease-in-out infinite; }
@keyframes nodePulse { 0%,100% { box-shadow:0 0 12px rgba(255,209,102,.35); } 50% { box-shadow:0 0 26px rgba(255,209,102,.75); } }
.level-card { width:calc(50% - 34px); background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; cursor:pointer; transition:.25s; display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
.path-item:nth-child(odd) .level-card { margin-right:auto; }
.path-item:nth-child(even) .level-card { margin-left:auto; }
.level-card:hover:not(.locked) { border-color:var(--gold); transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.35); }
.level-card.locked { opacity:.42; cursor:not-allowed; }
.level-card.done { border-color:rgba(34,214,138,.35); background:rgba(34,214,138,.05); }
.level-card.next { border-color:rgba(255,209,102,.5); background:rgba(255,209,102,.05); }
.level-icon { font-size:1.6rem; flex-shrink:0; }
.level-name { font-weight:700; font-size:.95rem; line-height:1.25; }
.level-desc { font-size:.76rem; color:var(--text2); margin-top:2px; }
.level-meta { font-size:.72rem; color:var(--text3); margin-top:5px; font-family:'Space Mono',monospace; }
.level-stars { font-size:.85rem; letter-spacing:1px; }

/* ============ KIT VISUEL — vitrine ============ */
.trophies { margin-top:26px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
.trophies h3 { font-size:1rem; font-weight:800; margin-bottom:4px; }
.trophies p { font-size:.8rem; color:var(--text2); margin-bottom:12px; }
.badge-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px; }
.badge-tile { text-align:center; padding:12px 6px 10px; border-radius:12px; background:var(--bg3); border:1px solid var(--border); transition:.3s; }
.badge-tile .b-icon { font-size:1.7rem; display:block; margin-bottom:4px; }
.badge-tile .b-name { font-size:.72rem; font-weight:700; line-height:1.2; }
.badge-tile .b-desc { font-size:.64rem; color:var(--text3); margin-top:3px; line-height:1.25; }
.badge-tile.locked { opacity:.45; filter:grayscale(1); }
.badge-tile.unlocked { border-color:rgba(255,209,102,.5); background:rgba(255,209,102,.07); box-shadow:0 0 16px rgba(255,209,102,.15) inset; }

/* ============ KIT VISUEL — briefing ============ */
.brief-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.brief-head .b-ico { font-size:2.4rem; }
.brief-head h2 { font-size:1.4rem; font-weight:900; line-height:1.2; }
.brief-head .b-sub { color:var(--text2); font-size:.85rem; }
.objectives { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; }
.objectives h4 { font-size:.85rem; font-weight:800; color:var(--gold); margin-bottom:8px; }
.objectives li { list-style:none; font-size:.88rem; padding:4px 0 4px 26px; position:relative; line-height:1.45; }
.objectives li::before { content:'✔'; position:absolute; left:4px; color:var(--accent); font-weight:900; }
.theory { background:linear-gradient(135deg, rgba(77,155,255,.07), rgba(167,139,250,.05)); border:1px solid rgba(77,155,255,.2); border-radius:var(--radius); padding:20px 22px; margin-bottom:16px; }
.theory h3 { font-size:1.05rem; font-weight:800; color:var(--blue); margin-bottom:10px; }
.theory-text { font-size:.92rem; line-height:1.7; }
.theory-text b { color:var(--accent); }
.theory-text p { margin:0 0 10px; }
.theory-text p:last-child { margin:0; }
.theory-text ul { padding-left:20px; margin:4px 0 10px; }
.theory-text li { margin:3px 0; }
.mini-table { width:100%; border-collapse:collapse; font-size:.85rem; margin:8px 0 10px; }
.mini-table th { text-align:left; padding:8px 10px; background:rgba(77,155,255,.12); color:var(--text2); font-weight:700; font-size:.78rem; }
.mini-table td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
.mini-table td:first-child { font-weight:800; color:var(--gold); white-space:nowrap; }
.example { background:rgba(255,138,61,.07); border:1px solid rgba(255,138,61,.2); border-radius:12px; padding:14px 18px; margin:14px 0 0; }
.example .ex-t { font-weight:800; color:var(--orange); font-size:.86rem; margin-bottom:6px; }
.example .ex-c { font-size:.88rem; line-height:1.6; }
.bonus { background:rgba(255,209,102,.06); border:1px solid rgba(255,209,102,.3); border-radius:12px; padding:14px 18px; margin:14px 0 0; }
.bonus .ex-t { font-weight:800; color:var(--gold); font-size:.86rem; margin-bottom:6px; }
.bonus .ex-c { font-size:.88rem; line-height:1.6; }
.predict { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:18px; text-align:center; }
.predict h4 { font-size:.9rem; font-weight:800; margin-bottom:4px; }
.predict p { font-size:.8rem; color:var(--text2); margin-bottom:10px; }
.chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.chip { padding:9px 16px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg3); color:var(--text); font-weight:700; font-size:.86rem; cursor:pointer; transition:.2s; }
.chip:hover { border-color:var(--gold); }
.chip.sel { border-color:var(--gold); background:rgba(255,209,102,.15); color:var(--gold); }

/* ============ KIT VISUEL — questions ============ */
.q-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:.8rem; color:var(--text2); }
.q-top b { color:var(--gold); }
.q-dots { display:flex; gap:5px; }
.q-dots span { width:9px; height:9px; border-radius:50%; background:var(--border); }
.q-dots span.c { background:var(--success); }
.q-dots span.h { background:var(--warning); }
.q-dots span.s { background:var(--error); }
.q-dots span.cur { background:var(--gold); box-shadow:0 0 8px var(--gold); }
.q-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; position:relative; overflow:hidden; }
.q-type { font-size:.74rem; color:var(--text3); margin-bottom:8px; }
.q-text { font-size:1.06rem; font-weight:600; line-height:1.55; margin-bottom:18px; }
.q-text .data { display:inline-block; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:8px 0 0; font-size:.92rem; font-weight:500; line-height:1.6; }
.q-text .data b { color:var(--gold); font-family:'Space Mono',monospace; font-size:.86rem; }
.q-card.shake { animation:shake .45s; }
@keyframes shake { 10%,90% { transform:translateX(-2px); } 20%,80% { transform:translateX(3px); } 30%,50%,70% { transform:translateX(-5px); } 40%,60% { transform:translateX(5px); } }
.options { display:flex; flex-direction:column; gap:10px; }
.opt { background:var(--bg2); border:1.5px solid var(--border); border-radius:12px; padding:13px 16px; cursor:pointer; transition:.22s; font-size:.93rem; text-align:left; display:flex; align-items:center; gap:12px; color:var(--text); }
.opt:hover:not(.dis) { border-color:var(--accent); background:rgba(34,214,138,.05); transform:translateX(3px); }
.opt .letter { width:30px; height:30px; border-radius:9px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem; color:var(--text2); flex-shrink:0; font-family:'Space Mono',monospace; }
.opt.ok { border-color:var(--success); background:rgba(34,214,138,.1); }
.opt.ok .letter { background:var(--success); color:var(--bg); }
.opt.ko { border-color:var(--error); background:rgba(255,77,109,.07); }
.opt.ko .letter { background:var(--error); color:#fff; }
.opt.dis { pointer-events:none; }
.opt.dis:not(.ok):not(.ko) { opacity:.55; }
.opt.chk .letter { background:var(--gold); color:var(--bg); }
.opt.chk { border-color:var(--gold); background:rgba(255,209,102,.08); }
.opt.chk.ok { border-color:var(--success); background:rgba(34,214,138,.1); }
.opt.miss { border-color:var(--warning); border-style:dashed; }
.vf { display:flex; gap:12px; }
.vf-btn { flex:1; padding:15px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg2); cursor:pointer; font-weight:800; font-size:1rem; color:var(--text); transition:.22s; }
.vf-btn:hover:not(.dis) { border-color:var(--accent); transform:translateY(-2px); }
.vf-btn.ok { border-color:var(--success); background:rgba(34,214,138,.12); color:var(--success); }
.vf-btn.ko { border-color:var(--error); background:rgba(255,77,109,.08); color:var(--error); }
.vf-btn.dis { pointer-events:none; }
.inp-wrap { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.inp { flex:1; min-width:200px; padding:13px 16px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg2); color:var(--text); font-family:'Space Mono',monospace; font-size:1rem; outline:none; transition:.2s; }
.inp:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,214,138,.12); }
.inp.ok { border-color:var(--success); }
.inp.ko { border-color:var(--error); }
.inp-unit { font-weight:800; color:var(--text2); }
.calc-preview { margin-top:8px; font-family:'Space Mono',monospace; font-size:.8rem; color:var(--purple); min-height:1.2em; }
.pool-label { font-size:.78rem; color:var(--text3); margin-bottom:8px; }
.pool { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:10px; border-radius:12px; background:var(--bg2); border:1px dashed var(--border); }
.tag { padding:8px 13px; border-radius:9px; font-size:.83rem; font-weight:600; cursor:pointer; transition:.2s; user-select:none; background:var(--bg3); border:1.5px solid var(--border); }
.tag:hover { border-color:var(--accent); transform:scale(1.04); }
.tag.sel { border-color:var(--gold); background:rgba(255,209,102,.15); color:var(--gold); box-shadow:0 0 10px rgba(255,209,102,.3); }
.tag.c1 { border-color:var(--success); background:rgba(34,214,138,.12); cursor:default; }
.tag.c2 { border-color:var(--warning); background:rgba(255,179,71,.12); cursor:default; }
.tag.x { border-color:var(--error); background:rgba(255,77,109,.1); cursor:default; }
.tag.bounce { animation:bounceBack .5s; }
@keyframes bounceBack { 0% { transform:scale(1.15); border-color:var(--error); } 100% { transform:scale(1); } }
.zones { display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px; }
@media(min-width:600px) { .zones { grid-template-columns:repeat(3,1fr); } .zones.two { grid-template-columns:repeat(2,1fr); } }
.zone { background:var(--card); border:2px dashed var(--border); border-radius:var(--radius); padding:12px; min-height:110px; transition:.25s; cursor:pointer; }
.zone.target { border-color:var(--gold); background:rgba(255,209,102,.05); }
.z-t { font-weight:800; font-size:.84rem; text-align:center; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border); }

/* ---------- Rotation déterministe des QCM (règle 3.7) ---------- */

const IND = {};
CRITERES.forEach(c => c.indicateurs.forEach(ind => { IND[ind.id] = Object.assign({ crit:c.id }, ind); }));
const STATUT = {
  atteint:    { ico:'✅', lab:'Atteint',                  cls:'st-ok'  },

function indAcc(onlyLv){
  const acc = {};

    L.questions.forEach((Q,i) => {
      const a = acc[Q.ind] || (acc[Q.ind] = { pts:0, max:0 });

}
function bilanIndicateurs(){
  const acc = indAcc(null);

    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || { pts:0, max:0 }; const r = a.max ? a.pts / a.max : 0; return Object.assign({}, ind, { ratio:r, statut:statutOf(r) }); });
    const tot = c.indicateurs.reduce((t, ind) => { const a = acc[ind.id] || { pts:0, max:0 }; return { pts:t.pts + a.pts, max:t.max + a.max }; }, { pts:0, max:0 });
    const r = tot.max ? tot.pts / tot.max : 0;

}

const RANKS = [

const TYPE_LABEL = { qcm:'QCM', vf:'Vrai ou faux', multi:'Sélection multiple', num:'Réponse à écrire', date:'Date à choisir', sort:'Classement', match:'Appariement', order:'Remise en ordre', gaps:'Texte à trous', grid:'Tableau de calcul', hunt:'Chasse aux erreurs' };

const APP = {

/* ---------- Utilitaires ---------- */
const $ = id => document.getElementById(id);
const ico = (id, cls) => `<svg class="ico${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#${id}"></use></svg>`;
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmt(n, dec){ return Number(n).toLocaleString('fr-BE', { minimumFractionDigits:dec, maximumFractionDigits:dec }); }
function fmtAns(n, unit){ return unit === '€' ? fmt(n, 2) : Number(n).toLocaleString('fr-BE', { maximumFractionDigits:2 }); }
function shuffled(n, seed){
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n-1; i > 0; i--) { s = (s*9301 + 49297) % 233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function evalExpr(s){
  let e = String(s).replace(/\s|\u00a0|€/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;
  try { const r = Function('"use strict";return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? r : null; }
  catch(err) { return null; }
}
function parseNum(s){
  const r = evalExpr(s); if (r !== null) return r;
  let t = String(s).replace(/\s|\u00a0|€/g,'');
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',', '.');
  else if ((t.match(/\./g)||[]).length > 1) t = t.replace(/\./g,'');
  return parseFloat(t);
}
function preview(s){
  const r = evalExpr(s || ''); if (r === null) return '';
  const pretty = String(s).replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\s+/g,' ').trim();
  return `${ico('i-calc')} ${esc(pretty)} → = ${fmt(Math.round(r*10000)/10000, 2)}`;
}
function key(lv,q){ return lv + '_' + q; }
function seedOf(lv,q){ return lv*31 + q*7 + 11; }
function getQ(lv,q){ return LEVELS[lv].questions[q]; }
function wordLabel(Q, i){ const base = Q.type === 'gaps' ? Q.words : Q.steps; return i < base.length ? base[i] : Q.distractors[i - base.length]; }

function S(lv,q){
  const k = key(lv,q);
  if (!APP.qs[k]) {
    const Q = getQ(lv,q), sd = seedOf(lv,q);
    const st = { tries:0, done:false, status:null, earned:0, fb:null, lock:{}, bounce:[] };
    switch (Q.type) {
      case 'qcm':   st.wrong = []; break;
      case 'vf':    st.picked = null; break;
      case 'multi': st.sel = []; st.order = shuffled(Q.options.length, sd); break;
      case 'num':   st.val = ''; break;
      case 'date':  st.d = ''; st.m = ''; st.y = ''; break;
      case 'sort':  st.place = {}; st.sel = null; st.order = shuffled(Q.items.length, sd); break;
      case 'match': { const opts = [...new Set(Q.pairs.map(p => p.a))].concat(Q.distractors); st.opts = shuffled(opts.length, sd).map(i => opts[i]); st.val = {}; break; }
      case 'order': st.slots = Q.steps.map(() => null); st.sel = null; st.order = shuffled(Q.steps.length + Q.distractors.length, sd); break;
      case 'gaps':  st.fill = Q.words.map(() => null); st.sel = null; st.order = shuffled(Q.words.length + Q.distractors.length, sd); break;
      case 'grid':  st.vals = Q.fields.map(() => ''); break;
      case 'hunt':  st.flags = {}; st.fa = 0; st.faMark = {}; break;

}
function cur(){ const lv = APP.level, q = APP.q; return { lv, q, Q:getQ(lv,q), st:S(lv,q) }; }

/* ---------- Sons (Web Audio, coupés par défaut) ---------- */
let AC = null;
function tone(freq, start, dur, type, vol){
  if (!APP.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + start;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .07, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch(e) {}
}
const sOk = () => { tone(660,0,.12); tone(990,.1,.16); };
const sKo = () => tone(220,0,.2,'triangle');
const sBadge = () => [784,988,1319].forEach((f,i) => tone(f, i*.1, .18));
const sLevel = () => [523,659,784,1047].forEach((f,i) => tone(f, i*.12, .22));

/* ---------- Statistiques ---------- */
function levelStats(lv){
  const L = LEVELS[lv]; let c=0, h=0, s=0, earned=0;
  L.questions.forEach((_,i) => { const st = APP.qs[key(lv,i)]; if (!st || !st.done) return; earned += st.earned; if (st.status==='correct') c++; else if (st.status==='hint') h++; else s++; });
  const n = L.questions.length;

}
function starsFor(p){ return p >= 85 ? '★★★' : p >= 65 ? '★★☆' : p >= 45 ? '★☆☆' : '☆☆☆'; }
function gradeFor(p){ return p >= 85 ? 'A — Excellent' : p >= 65 ? 'B — Très bien' : p >= 45 ? 'C — Satisfaisant' : 'D — À retravailler'; }
function medalFor(p){ return p >= 90 ? '🏆' : p >= 70 ? '🥇' : p >= 50 ? '🥈' : '🥉'; }

/* ---------- Scoring ---------- */

function finishFeedback(Q, st, status, extra){
  if (status === 'correct') st.fb = { k:'ok',  t:'Juste du premier coup', i:'i-check', h:(extra||'') + Q.explain };
  else if (status === 'hint') st.fb = { k:'ok2', t:'Juste au 2e essai', i:'i-redo', h:(extra||'') + Q.explain };
  else st.fb = { k:'ko', t:'Voici la correction', i:'i-info', h:(extra||'') + answerText(Q) + Q.explain };
}
function finishSimple(ev, lv, q, status){
  const Q = getQ(lv,q), st = S(lv,q);
  const earned = status === 'correct' ? Q.pts : status === 'hint' ? Q.pts/2 : 0;
  finishFeedback(Q, st, status);
  award(ev, lv, q, earned, status);
}
function info(msg){ const { st } = cur(); st.fb = { k:'info', t:'Il manque quelque chose', i:'i-info', h:msg }; renderScreen(); }

/* Exercices à éléments : verrouillage progressif (règle 3.8) */
function itemsVerify(ev, ids, isRight, reset){
  const { lv, q, Q, st } = cur();
  st.tries++; st.bounce = [];
  ids.forEach(i => { if (st.lock[i]) return; if (isRight(i)) st.lock[i] = st.tries; else if (st.tries === 2) st.lock[i] = 'x'; });
  const nOk = ids.filter(i => st.lock[i] === 1).length;
  if (st.tries === 1 && nOk < ids.length) {
    ids.forEach(i => { if (!st.lock[i]) { reset(i); st.bounce.push(i); } });
    fail();
    const lead = nOk === 0 ? `Aucun élément n'est encore juste.` : `<b>${nOk}</b> élément${nOk>1?'s':''} sur ${ids.length} ${nOk>1?'sont justes et verrouillés':'est juste et verrouillé'} en vert.`;
    st.fb = { k:'hint', t:'Pas encore — dernier essai', i:'i-bulb', h:`${lead} ${Q.hint || ''}` };
  } else itemFinish(ev, lv, q, ids, 0);
  renderScreen();
}
function itemFinish(ev, lv, q, ids, penalty){
  const Q = getQ(lv,q), st = S(lv,q), per = Q.pts / ids.length;
  let earned = 0;
  ids.forEach(i => { if (st.lock[i] === 1) earned += per; else if (st.lock[i] === 2) earned += per/2; });
  earned = Math.max(0, Math.round((earned - penalty) * 2) / 2);
  const allFirst = ids.every(i => st.lock[i] === 1), noX = ids.every(i => st.lock[i] !== 'x');
  const status = allFirst && !penalty && st.tries === 1 ? 'correct' : noX ? 'hint' : 'shown';
  const extra = penalty ? `Fausses alertes : −${penalty} XP. ` : '';
  finishFeedback(Q, st, status, extra);
  award(ev, lv, q, earned, status);
}

/* ---------- Actions de l'élève ---------- */
function pickOpt(i, ev){
  const { lv, q, Q, st } = cur(); if (st.done || st.wrong.includes(i)) return;
  st.tries++;
  if (i === Q.correct) finishSimple(ev, lv, q, st.tries === 1 ? 'correct' : 'hint');
  else {
    st.wrong.push(i);
    if (st.tries === 1) { fail(); st.fb = { k:'hint', t:'Pas encore — un indice', i:'i-bulb', h:Q.hint }; }
    else finishSimple(ev, lv, q, 'shown');
  }
  renderScreen();
}
function pickVF(v, ev){
  const { lv, q, Q, st } = cur(); if (st.done) return;
  st.tries = 1; st.picked = v;
  if (v === Q.answer) finishSimple(ev, lv, q, 'correct'); else { APP.flash = 'shake'; finishSimple(ev, lv, q, 'shown'); }
  renderScreen();
}
function toggleMulti(i){ const { st } = cur(); if (st.done) return; const k = st.sel.indexOf(i); if (k >= 0) st.sel.splice(k,1); else st.sel.push(i); if (st.fb && st.fb.k === 'info') st.fb = null; renderScreen(); }
function numInput(el){ const { st } = cur(); st.val = el.value; const p = $('numPrev'); if (p) p.innerHTML = preview(el.value); }
function gridInput(i, el){ const { st } = cur(); st.vals[i] = el.value; const p = $('gp' + i); if (p) p.innerHTML = preview(el.value); }
function dateSel(part, v){ const { st } = cur(); st[part] = v; }
function matchSel(i, v){ const { st } = cur(); if (v === '') delete st.val[i]; else st.val[i] = +v; }
function tagClick(i, ev){
  if (ev) ev.stopPropagation();
  const { st } = cur(); if (st.done) return;
  /* une étiquette est déjà choisie et l'élève clique sur une étiquette posée dans une zone : on dépose dans cette zone */
  if (st.sel != null && st.sel !== i && st.place[i] != null) { st.place[st.sel] = st.place[i]; st.sel = null; st.bounce = []; return renderScreen(); }
  if (st.lock[i]) return;
  st.sel = st.sel === i ? null : i; st.bounce = []; renderScreen();
}
function zoneClick(z){ const { st } = cur(); if (st.done || st.sel == null) return; st.place[st.sel] = z; st.sel = null; st.bounce = []; renderScreen(); }
function poolClick(ev){ const { st } = cur(); if (st.done || st.sel == null || ev.target !== ev.currentTarget) return; delete st.place[st.sel]; st.sel = null; renderScreen(); }
function pieceClick(pi, ev){ if (ev) ev.stopPropagation(); const { st } = cur(); if (st.done) return; st.sel = st.sel === pi ? null : pi; st.bounce = []; renderScreen(); }
function slotClick(s){
  const { Q, st } = cur(); if (st.done || st.lock[s]) return;
  const arr = Q.type === 'gaps' ? st.fill : st.slots;
  if (st.sel != null) { arr[s] = st.sel; st.sel = null; } else if (arr[s] != null) arr[s] = null;
  st.bounce = []; renderScreen();
}
function huntClick(i){ const { st } = cur(); if (st.done || st.lock[i] || st.faMark[i]) return; st.flags[i] = !st.flags[i]; renderScreen(); }

function verify(ev){
  const { lv, q, Q, st } = cur(); if (st.done) return;
  switch (Q.type) {
    case 'multi': {
      if (!st.sel.length) return info('Coche au moins une proposition avant de vérifier.');
      st.tries++;
      const exact = st.sel.length === Q.correct.length && Q.correct.every(i => st.sel.includes(i));
      if (exact) finishSimple(ev, lv, q, st.tries === 1 ? 'correct' : 'hint');
      else if (st.tries === 1) { fail(); st.fb = { k:'hint', t:'Pas encore — un indice', i:'i-bulb', h:Q.hint }; }
      else finishSimple(ev, lv, q, 'shown');
      return renderScreen();
    }
    case 'num': {
      const v = parseNum(st.val);
      if (String(st.val).trim() === '' || isNaN(v)) return info('Écris un nombre, ou ton calcul, avant de vérifier.');
      st.tries++;
      if (Math.abs(v - Q.answer) <= (Q.tol || 0.02) + 1e-9) finishSimple(ev, lv, q, st.tries === 1 ? 'correct' : 'hint');
      else if (st.tries === 1) { fail(); st.fb = { k:'hint', t:'Pas encore — un indice', i:'i-bulb', h:Q.hint }; }
      else finishSimple(ev, lv, q, 'shown');
      return renderScreen();
    }
    case 'date': {
      if (!st.d || !st.m || !st.y) return info("Choisis le jour, le mois et l'année avant de vérifier.");
      st.tries++;
      const ok = +st.d === Q.answer[0] && +st.m === Q.answer[1] && +st.y === Q.answer[2];
      if (ok) finishSimple(ev, lv, q, st.tries === 1 ? 'correct' : 'hint');
      else if (st.tries === 1) { fail(); st.fb = { k:'hint', t:'Pas encore — un indice', i:'i-bulb', h:Q.hint }; }
      else finishSimple(ev, lv, q, 'shown');
      return renderScreen();
    }
    case 'sort': {
      if (Q.items.some((_,i) => st.place[i] == null)) return info('Place toutes les étiquettes avant de vérifier.');
      return itemsVerify(ev, Q.items.map((_,i) => i), i => st.place[i] === Q.items[i].z, i => { delete st.place[i]; });
    }
    case 'match': {
      if (Q.pairs.some((_,i) => st.val[i] == null)) return info('Choisis une réponse sur chaque ligne avant de vérifier.');
      return itemsVerify(ev, Q.pairs.map((_,i) => i), i => st.opts[st.val[i]] === Q.pairs[i].a, i => { delete st.val[i]; });
    }
    case 'order': {
      if (st.slots.some(x => x == null)) return info('Remplis tous les emplacements numérotés avant de vérifier.');
      return itemsVerify(ev, Q.steps.map((_,i) => i), s => st.slots[s] === s, s => { st.slots[s] = null; });
    }
    case 'gaps': {
      if (st.fill.some(x => x == null)) return info('Complète tous les trous avant de vérifier.');
      return itemsVerify(ev, Q.words.map((_,i) => i), g => st.fill[g] === g, g => { st.fill[g] = null; });
    }
    case 'grid': {
      if (Q.fields.some((_,i) => !st.lock[i] && (String(st.vals[i]).trim() === '' || isNaN(parseNum(st.vals[i]))))) return info('Remplis chaque case avec un nombre (ou un calcul) avant de vérifier.');
      return itemsVerify(ev, Q.fields.map((_,i) => i), i => Math.abs(parseNum(st.vals[i]) - Q.fields[i].answer) <= (Q.fields[i].tol || 0.02) + 1e-9, () => {});
    }
    case 'hunt': return huntVerify(ev);
  }
}
function huntVerify(ev){
  const { lv, q, Q, st } = cur();
  const errs = Q.sentences.map((s,i) => s.err ? i : -1).filter(i => i >= 0);
  st.tries++;
  errs.forEach(i => { if (st.lock[i]) return; if (st.flags[i]) st.lock[i] = st.tries; else if (st.tries === 2) st.lock[i] = 'x'; });
  let newFa = 0;
  Q.sentences.forEach((s,i) => { if (!s.err && st.flags[i] && !st.faMark[i]) { st.fa++; newFa++; st.faMark[i] = true; st.flags[i] = false; } });
  const found = errs.filter(i => st.lock[i] === 1).length;
  if (st.tries === 1 && found < errs.length) {
    fail();
    st.fb = { k:'hint', t:'Pas encore — dernier essai', i:'i-bulb', h:`Tu as repéré <b>${found}</b> erreur${found>1?'s':''} sur ${errs.length}${newFa ? ` et signalé ${newFa} phrase${newFa>1?'s':''} correcte${newFa>1?'s':''} (−${newFa} XP)` : ''}. ${Q.hint}` };
    renderScreen();
  } else { itemFinish(ev, lv, q, errs, st.fa); renderScreen(); }
}

/* ---------- Navigation ---------- */
function setScreen(name){ APP.screen = name; renderScreen(); window.scrollTo({ top:0, behavior:'smooth' }); }
function goHub(){ if (!APP.validated) { showEmailModal(); return; } setScreen('hub'); }
function startApp(){ if (!APP.validated) { showEmailModal(); return; } setScreen('hub'); }
function openLevel(lv){
  if (!APP.validated) { showEmailModal(); return; }
  if (!isUnlocked(lv)) return;
  APP.level = lv;
  if (!APP.done.includes(lv) && APP.timerLevel !== lv && !APP.completedExercises.includes(lv)) { startExerciseTimer(lv); APP.timerLevel = lv; }
  setScreen(APP.done.includes(lv) ? 'bilan' : 'brief');
}
function setPred(lv, v){ APP.pred[lv] = v; renderScreen(); }
function startLevel(){
  const lv = APP.level; if (APP.pred[lv] == null) return;
  APP.q = APP.prog[lv] || 0;
  setScreen('question');
}
function nextQ(){
  const lv = APP.level, L = LEVELS[lv];
  if (!S(lv, APP.q).done) return;
  if (APP.q < L.questions.length - 1) { APP.q++; APP.prog[lv] = APP.q; setScreen('question'); }
  else finishLevel(lv);
}
function finishLevel(lv){
  if (!APP.done.includes(lv)) {
    APP.done.push(lv); APP.prog[lv] = 0;
    completeExercise(lv);
    sLevel();
    if (levelStats(lv).pctFirst >= 70 || APP.done.length === LEVELS.length) confetti();
    checkBadges();
  }
  setScreen('bilan');
}
function restartAll(){
  TRACKING.sessionId = new Date().toISOString();
  resetState();
  APP.globalTimerStart = Date.now();
  setScreen('hub');
}
function resetState(){
  Object.assign(APP, { level:0, q:0, score:0, streak:0, bestStreak:0, qs:{}, prog:{}, done:[], pred:{}, badges:{}, flash:null,
    completedExercises:[], exerciseStartTime:null, exerciseTimes:{}, exerciseScores:{}, scoreBeforeExercise:0, timerLevel:null });
  updateHUD();
}

}

function renderQuestion(lv, q){
  const L = LEVELS[lv], Q = getQ(lv,q), st = S(lv,q), n = L.questions.length;
  const dots = L.questions.map((_,i) => { const s = APP.qs[key(lv,i)]; let c = ''; if (s && s.done) c = { correct:'c', hint:'h', shown:'s' }[s.status]; else if (i === q) c = 'cur'; return `<span class="${c}"></span>`; }).join('');
  const shake = APP.flash === 'shake' ? ' shake' : ''; APP.flash = null;
  const tries = Q.type === 'vf' ? 1 : 2;

function rFeedback(st){ if (!st.fb) return ''; return `<div class="fb ${st.fb.k}" role="status"><div class="fb-t">${ico(st.fb.i)} ${st.fb.t}</div><div>${st.fb.h}</div></div>`; }
function rButtons(lv, q, Q, st){

function lockCls(v){ return v === 1 ? 'c1' : v === 2 ? 'c2' : v === 'x' ? 'x' : ''; }

function rQcm(Q, st){

}
function rVf(Q, st){

function rMulti(Q, st){

function rNum(Q, st){

function rDate(Q, st){

  const months = '<option value="">—</option>' + MONTHS.map((m,i) => opt(i+1, m, st.m)).join('');

function rSort(Q, st){

  const pool = st.order.filter(i => st.place[i] == null).map(tag).join('');
  const zc = Q.zones.length === 2 ? 'two' : Q.zones.length === 4 ? 'four' : '';
  return `<div class="pool-label">Clique sur une étiquette, puis sur la zone où elle doit aller. Un clic dans la réserve la ramène.</div>

  <div class="zones ${zc}">${Q.zones.map((z,zi) => `<div class="zone ${st.sel != null ? 'target' : ''}" onclick="zoneClick(${zi})"><div class="z-t">${z}</div><div class="z-items">${st.order.filter(i => st.place[i] === zi).map(tag).join('')}</div></div>`).join('')}</div>`;

function rMatch(Q, st){

    return `<div class="m-row"><div class="m-term">${p.t}</div><div style="flex:1.4;display:flex;flex-direction:column;gap:4px">

function rPool(Q, st, used){

}
function rOrder(Q, st){
  const slots = Q.steps.map((_,s) => { const pi = st.slots[s], lk = st.lock[s];
    const content = pi == null ? '<span class="slot-empty">Emplacement libre — clique ici après avoir choisi une étiquette</span>' : `<span class="tag ${lockCls(lk)} ${st.bounce.includes(s) ? 'bounce' : ''}">${wordLabel(Q, pi)}</span>`;
    return `<div class="slot ${st.sel != null && !lk ? 'target' : ''}" onclick="slotClick(${s})" role="button" tabindex="0"><span class="slot-n">${s+1}</span><div>${content}${lk === 'x' ? `<span class="fix">→ ${Q.steps[s]}</span>` : ''}</div></div>`; }).join('');
  return `<div class="pool-label">Choisis une étiquette dans la réserve, puis clique sur son emplacement. Un clic sur un emplacement rempli le vide.</div><div class="slots">${slots}</div>${rPool(Q, st, st.slots)}`;

function rGaps(Q, st){

function rGrid(Q, st){

    return `<div class="g-row ${f.total ? 'total' : ''}"><div class="g-lbl">${f.label}</div>

function rHunt(Q, st){
  return `<div class="pool-label">Clique sur une phrase pour la signaler (ou la dé-signaler), puis vérifie.</div><div class="hunt">${Q.sentences.map((s,i) => {
    const lk = st.lock[i]; let c = 'h-line', extra = '';

    else if (st.done) c += ' dis';
    else if (st.flags[i]) c += ' flag';
    return `<button class="${c}" onclick="huntClick(${i})" aria-pressed="${!!st.flags[i]}">${s.t}${extra}</button>`;
  }).join('')}</div>`;
}

function showEmailModal(){

function validateEmail(){
  const input = $('emailInput'), btn = $('emailBtn'), errDiv = $('emailError');
  const email = input.value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errDiv.textContent = '⚠️ Entre une adresse email valide.'; input.style.borderColor = 'var(--error)'; return; }
  btn.textContent = '⏳ Vérification…'; btn.disabled = true; errDiv.textContent = ''; input.style.borderColor = '';
  const cbName = '_emailCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    errDiv.textContent = '⚠️ Connexion impossible. Vérifie ta connexion internet.';
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
  }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
    if (resp && resp.found) {
      const oldEmail = lsGet('student_email');
      lsSet('student_email', email); lsSet('student_classe', resp.classe || '');
      APP.email = email; APP.classe = resp.classe || '';
      if (oldEmail && oldEmail !== email) resetProgression();
      TRACKING.sessionId = new Date().toISOString();
      $('emailOverlay').style.display = 'none';
      startGlobalTimer();
      onEmailValidated();
    } else {
      errDiv.textContent = "⚠️ Cette adresse email n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
      input.style.borderColor = 'var(--error)';
    }
  };
  const s = document.createElement('script'); s.id = cbName;
  s.src = `${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); errDiv.textContent = '⚠️ Erreur de connexion au serveur.'; btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false; };
  document.body.appendChild(s);
}

function startExerciseTimer(exIdx){ APP.exerciseStartTime = Date.now(); APP.scoreBeforeExercise = APP.score || 0; }

  const title = tab === 'app' ? '🏆 Classement — ' + TRACKING.appName + classeLabel : '🌍 Classement général' + classeLabel;
  if (tab === 'global' && data.length > 0) {
    data = data.slice().sort((a,b) => { const pA = a.pct != null ? a.pct : (a.pourcentage || 0), pB = b.pct != null ? b.pct : (b.pourcentage || 0); if (pB !== pA) return pB - pA; return (a.totalTemps || a.totalTime || 0) - (b.totalTemps || b.totalTime || 0); });
    data.forEach((e,i) => { e.rang = i + 1; });
  }
  const me = data.find(r => r.email === myEmail);
  let html = `<div style="font-size:1rem;font-weight:800;margin-bottom:16px;text-align:center;">${title}</div>`;
  if (me) {
    const pct = me.pct != null ? me.pct : (me.pourcentage != null ? me.pourcentage : 0);
    const count = tab === 'app' ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === 'app' ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const label = tab === 'app' ? 'niveaux' : 'apps';
    const prog = total > 0 ? count + '/' + total + ' ' + label : count + ' ' + label;
    const pc = pct >= 80 ? 'var(--success)' : pct >= 50 ? 'var(--orange)' : 'var(--error)';
    html += `<div style="background:rgba(34,214,138,.08);border:1px solid rgba(34,214,138,.3);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-around;text-align:center;gap:8px;flex-wrap:wrap">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">#${me.rang}</div><div style="font-size:.7rem;color:var(--text2)">RANG</div></div>
      <div><div style="font-size:1.3rem;font-weight:800">${me.totalPoints}</div><div style="font-size:.7rem;color:var(--text2)">POINTS</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pc}">${pct}%</div><div style="font-size:.7rem;color:var(--text2)">RÉUSSITE</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2)">${prog}</div><div style="font-size:.7rem;color:var(--text2)">PROGRESSION</div></div></div>`;
    if (total > 0) html += `<div style="height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-bottom:16px"><div style="height:100%;width:${Math.min(100, count/total*100)}%;background:linear-gradient(90deg,var(--accent),var(--gold))"></div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  html += '<table style="width:100%;border-collapse:collapse;font-size:.85rem;"><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:.72rem;">#</th><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:.72rem;">Élève</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem;">Pts</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem;">%</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem;">Temps</th></tr>';
  data.forEach(row => {
    const r = row.rang || 0, name = esc(String(row.email).split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '));
    const p2 = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0), temps = row.totalTemps || row.totalTime || 0, isMe = row.email === myEmail;
    const pC = p2 >= 80 ? 'var(--success)' : p2 >= 50 ? 'var(--orange)' : 'var(--error)';
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,.03);background:${isMe ? 'rgba(34,214,138,.08)' : 'transparent'}"><td style="padding:8px 4px;font-weight:700">${r <= 3 && r > 0 ? medals[r-1] : r}</td><td style="padding:8px 4px;${isMe ? 'font-weight:800;color:var(--accent)' : ''}">${name}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent)">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pC}">${p2}%</td><td style="padding:8px 4px;text-align:right;color:var(--text2);font-family:'Space Mono',monospace;font-size:.78rem">${temps > 0 ? formatTime(temps) : '—'}</td></tr>`;
  });
  content.innerHTML = html + '</table>';
}

/* ---------- Démarrage ---------- */
function init(){ initTicks(); renderScreen(); showEmailModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLB(); closeRankup(); } });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
</html>
